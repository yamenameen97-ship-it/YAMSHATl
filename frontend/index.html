<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="theme-color" content="#0A0D1A" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="يام شات - تطبيق التواصل الاجتماعي العربي مع دردشة وريلز وبث مباشر" />
    <meta name="application-name" content="Yamshat" />
    <!-- ✅ v88.93 ROOT FIX #3: CSP تسمح بـ 'unsafe-inline' لـ script-src
         السبب: HTML bridge الذي يُرجعه Service Worker عند /share-target يحتوي
         على <script> مضمّن (window.location.replace) وكان مرفوضاً في v88.92.
         النتيجة السابقة: كان meta-refresh فقط هو الذي يعمل (بطيء) وأحياناً
         يتجاهله Chrome في سياق PWA فتظهر صفحة بيضاء.
         نضيف أيضاً 'unsafe-eval' اختياري إذا احتاجت أي مكتبة، ونحافظ على
         الأمان بتضييق باقي المصادر. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; img-src 'self' data: blob: https:; connect-src 'self' https: wss: data: blob:; media-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https: https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'" />

    <!-- DNS prefetch + preconnect لتسريع تحميل الخط على الأجهزة الضعيفة -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- خط Noto Sans Arabic مع display=swap لتجنّب FOIT على الأجهزة البطيئة -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap"
    />

    <style>
      /* خط افتراضي على مستوى المستند بالكامل */
      html, body {
        font-family: 'Noto Sans Arabic', 'Tajawal', 'Cairo', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        direction: rtl;
        background-color: #0A0D1A;
        color: #fff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        max-width: 100vw;
      }
      /* منع التكبير التلقائي عند التركيز على input في iOS */
      input, textarea, select { font-size: 16px; }
      /* تحسين الأداء على الأجهزة الضعيفة (Redmi Note 8 وما شابهها) */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      /* شاشة تحميل بسيطة قبل تحميل React */
      #root:empty::before {
        content: '';
        position: fixed;
        inset: 0;
        background: #0A0D1A url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><line x1='25' y1='25' x2='50' y2='58' stroke='%238B5CF6' stroke-width='12' stroke-linecap='round'/><line x1='75' y1='25' x2='50' y2='58' stroke='%238B5CF6' stroke-width='12' stroke-linecap='round'/><line x1='50' y1='58' x2='50' y2='85' stroke='%238B5CF6' stroke-width='12' stroke-linecap='round'/></svg>") center / 80px no-repeat;
        animation: ym-pulse 1.4s ease-in-out infinite;
      }
      @keyframes ym-pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>

    <!-- إعدادات PWA و iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yamshat" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>YAMSHAT - يام شات</title>
    <script src="/app-config.js?v=20260801-r11-share-preserve" data-backend-origin="%VITE_BACKEND_ORIGIN%" data-api-base="%VITE_API_BASE%" data-socket-url="%VITE_SOCKET_URL%"></script>

    <!-- ✅ v89.16 ROOT FIX #4: watchdog على تحميل حزمة React (main.jsx)
         السبب الجذري: إذا تعطّل CDN الخط، أو فشل تحميل main.jsx بسبب كاش قديم،
         أو انهار Vite bundle على شبكة بطيئة → #root يبقى فارغاً إلى الأبد وشاشة
         التحميل النبضية تبقى معلّقة → المستخدم يرى شاشة بيضاء لا نهائية.
         الحل: بعد 8 ثوانٍ من عدم ظهور أي شيء داخل #root نعرض بطاقة تشخيص واضحة
         + زر إعادة تحميل + زر مسح الكاش. -->
    <script>
      (function () {
        var WATCHDOG_MS = 8000;
        var kicked = false;
        function kick() {
          if (kicked) return;
          try {
            var root = document.getElementById('root');
            if (root && root.childElementCount > 0) return; // React mounted
          } catch (_) { /* ignore */ }
          kicked = true;
          try {
            var wrap = document.createElement('div');
            wrap.setAttribute('dir', 'rtl');
            wrap.style.cssText = 'position:fixed;inset:0;background:#0A0D1A;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Arabic","Tajawal",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;z-index:2147483647';
            wrap.innerHTML = '<div style="max-width:480px;width:100%;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.35);border-radius:20px;padding:24px;text-align:center;box-sizing:border-box">' +
              '<div style="font-size:44px;line-height:1">⚠️</div>' +
              '<h1 style="font-size:1.2rem;margin:14px 0 6px;font-weight:900">تعذّر تحميل يام شات</h1>' +
              '<p style="color:#94A3B8;margin:0 0 16px;font-size:.95rem;line-height:1.7">لم تكتمل حزمة التطبيق خلال 8 ثوانٍ. قد يكون هذا بسبب اتصال ضعيف أو نسخة قديمة محفوظة على جهازك.</p>' +
              '<button id="ym-wd-reload" style="width:100%;padding:12px 18px;border:0;border-radius:12px;background:linear-gradient(135deg,#8B5CF6,#EC4899);color:#fff;font-weight:800;font-size:1rem;margin-bottom:10px;cursor:pointer;font-family:inherit">🔄 إعادة تحميل الصفحة</button>' +
              '<button id="ym-wd-purge" style="width:100%;padding:12px 18px;border:1px solid rgba(139,92,246,.4);border-radius:12px;background:transparent;color:#e9d5ff;font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit">🧹 مسح الكاش وإعادة التحميل</button>' +
              '<p style="color:#64748b;font-size:12px;margin:14px 0 0">إذا استمرت المشكلة، أغلق تطبيق يام شات من الخلفية ثم افتحه من جديد.</p>' +
              '</div>';
            document.body.appendChild(wrap);
            var reloadBtn = document.getElementById('ym-wd-reload');
            var purgeBtn = document.getElementById('ym-wd-purge');
            if (reloadBtn) reloadBtn.addEventListener('click', function () {
              try { window.location.reload(); } catch (_) { window.location.href = '/'; }
            });
            if (purgeBtn) purgeBtn.addEventListener('click', function () {
              try {
                if ('caches' in window) {
                  caches.keys().then(function (keys) {
                    // احتفظ بـ share-fallback (يحوي أي مشاركة مستقبلة)
                    var kill = keys.filter(function (k) { return !/^yamshat-share-fallback/i.test(k); });
                    return Promise.all(kill.map(function (k) { return caches.delete(k).catch(function () { return null; }); }));
                  }).then(function () { window.location.reload(); }).catch(function () { window.location.reload(); });
                } else {
                  window.location.reload();
                }
              } catch (_) { window.location.reload(); }
            });
          } catch (_) {
            try { window.location.reload(); } catch (__) {}
          }
        }
        setTimeout(kick, WATCHDOG_MS);
      })();
    </script>
  </head>
  <body dir="rtl">
    <div id="root"></div>
    <noscript>
      <div style="font-family: 'Noto Sans Arabic', sans-serif; padding: 20px; text-align: center; direction: rtl;">
        يرجى تفعيل JavaScript في المتصفح لاستخدام يام شات.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;

    # ✅ v89.08 ROOT FIX #1: زيادة حجم جسم الطلب لاستقبال الفيديوهات المشاركة
    #   يوتيوب/فيسبوك/تيك توك قد يرسلون ملفات كبيرة عبر share_target POST.
    #   القيمة الافتراضية 1MB تسبب فشل الاستقبال بصمت (413 Request Entity Too Large).
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_body_timeout 120s;

    location = /app-config.js {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /background-sync.js {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /sw.js {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
    }

    # ✅ v89.08 ROOT FIX #2: مسار /share-target يجب أن يقبل POST + GET
    #   السبب الجذري السابق (v89.07):
    #     nginx كان يرد بـ 405 Method Not Allowed أو يفشل بصمت عندما يصل POST
    #     من يوتيوب/فيسبوك/إنستجرام قبل تسجيل SW (أول مشاركة تماماً).
    #     try_files لا يعمل مع POST → nginx يرفض الطلب → المستخدم لا يرى شيئاً.
    #
    #   الحل:
    #     - نقبل POST + GET صراحةً.
    #     - نُعيد index.html بحالة 200 لأي طريقة (حتى لو POST) ليتحمل SPA
    #       تحميل SW ثم إعادة إرسال الطلب.
    #     - error_page 405 =200 يحوّل رد nginx الافتراضي لـ POST إلى 200 OK.
    location = /share-target {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # اقبل POST + GET + أي طريقة أخرى — لا ترفض بـ 405
        error_page 405 =200 /index.html;
        # الحد الأقصى لجسم الطلب لهذا المسار (فيديوهات مشاركة)
        client_max_body_size 100M;
        # نُعيد index.html بغض النظر عن الطريقة
        try_files /index.html =200;
    }

    # ✅ v89.08: نفس الحماية لأي مسار فرعي تحت /share-target
    location ^~ /share-target/ {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        error_page 405 =200 /index.html;
        client_max_body_size 100M;
        try_files /index.html =200;
    }

    location = /sw-enhanced.js {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /manifest.webmanifest {
        add_header Cache-Control "max-age=3600";
        add_header Content-Type "application/manifest+json";
    }

    location ~* \.html?$ {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
    }
}

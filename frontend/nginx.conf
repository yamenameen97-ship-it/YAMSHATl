server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;

    # ✅ v89.08 ROOT FIX #1: زيادة حجم جسم الطلب لاستقبال الفيديوهات المشاركة
    #   يوتيوب/فيسبوك/تيك توك قد يرسلون ملفات كبيرة عبر share_target POST.
    #   القيمة الافتراضية 1MB تسبب فشل الاستقبال بصمت (413 Request Entity Too Large).
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_body_timeout 120s;

    location = /app-config.js {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /background-sync.js {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ✅ v89.18 ROOT FIX #6: sw.js — max-age=0, must-revalidate (وليس no-store)
    #   السبب الجذري:
    #     في التسجيل نستخدم updateViaCache: 'none' الذي يتجاوز HTTP cache
    #     عند التحقّق من التحديث. عندما يكون الرد no-store لا يستطيع المتصفح
    #     تخزين نسخة مرجعية للـ byte-for-byte diff الذي يعتمد عليه
    #     Service Worker Update Algorithm → قد يعيد تنزيل sw.js بلا داعٍ
    #     أو يفشل في اكتشاف التحديث بصمت على بعض إصدارات Android Chrome.
    #     الحل: max-age=0, must-revalidate يسمح للمتصفح بحفظ نسخة مرجعية
    #     لكن يجبره على التحقّق من الخادم في كل مرة (متوافق مع updateViaCache: 'none').
    location = /sw.js {
        add_header Cache-Control "max-age=0, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
    }

    # ✅ v89.08 ROOT FIX #2: مسار /share-target يجب أن يقبل POST + GET
    #   السبب الجذري السابق (v89.07):
    #     nginx كان يرد بـ 405 Method Not Allowed أو يفشل بصمت عندما يصل POST
    #     من يوتيوب/فيسبوك/إنستجرام قبل تسجيل SW (أول مشاركة تماماً).
    #     try_files لا يعمل مع POST → nginx يرفض الطلب → المستخدم لا يرى شيئاً.
    #
    #   الحل:
    #     - نقبل POST + GET صراحةً.
    #     - نُعيد index.html بحالة 200 لأي طريقة (حتى لو POST) ليتحمل SPA
    #       تحميل SW ثم إعادة إرسال الطلب.
    #     - error_page 405 =200 يحوّل رد nginx الافتراضي لـ POST إلى 200 OK.
    location = /share-target {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # اقبل POST + GET + أي طريقة أخرى — لا ترفض بـ 405
        error_page 405 =200 /index.html;
        # الحد الأقصى لجسم الطلب لهذا المسار (فيديوهات مشاركة)
        client_max_body_size 100M;
        # نُعيد index.html بغض النظر عن الطريقة
        try_files /index.html =200;
    }

    # ✅ v89.08: نفس الحماية لأي مسار فرعي تحت /share-target
    location ^~ /share-target/ {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        error_page 405 =200 /index.html;
        client_max_body_size 100M;
        try_files /index.html =200;
    }

    location = /sw-enhanced.js {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
    }

    # ✅ v89.10 ROOT FIX #6: حرمان sw-pwa-enhanced.js من الكاش الطويل
    #   السبب الجذري:
    #     قاعدة location ~* \.(js|css|...)$ أسفله كانت تُطبّق expires 1y
    #     على sw-pwa-enhanced.js. أي جهاز حمّل الملف القديم يبقى مع نسخته
    #     المخزّنة لمدة سنة → حتّى بعد رفع v89.10 لا يرى الـ stub الجديد.
    #   الحل: no-cache مطلق لـ sw-pwa-enhanced.js ويُقدَّم قبل القاعدة العامة.
    location = /sw-pwa-enhanced.js {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
    }

    # ✅ v89.10: إذا طلب المتصفح /sw-push.js القديم — لا كاشة أيضاً
    location = /sw-push.js {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ✅ v89.17 ROOT FIX #5: منع كاش manifest — الجوال كان يحتفظ بنسخة قديمة
    #   بها start_url=/?pwa=1&v=89.08 ويتجاهل التحديثات → intent المشاركة
    #   المسجّل في أندرويد يبقى مربوطاً بالنسخة القديمة.
    location = /manifest.webmanifest {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Content-Type "application/manifest+json";
    }

    location ~* \.html?$ {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
    }
}
